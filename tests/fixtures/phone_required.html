<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Win a jacket</title></head>
<body>
<h1>Enter competition</h1>
<!-- Horse&Rider (SurveyMonkey): the phone box is required in the HTML but has no asterisk. -->
<form id="f">
  <label>* First name <input name="fn" required></label>
  <label>Email address <input type="email" name="em" required></label>
  <label>Phone number <input type="tel" name="ph" required aria-required="true"></label>
  <button type="submit">Done</button>
</form>
</body></html>
