<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Embed consent</title></head>
<body>
<h1>Win a Mini Garden Greenhouse</h1>
<p>To be in with a chance of winning, simply answer the question below.</p>
<div id="embed" class="consent-placeholder">
  <div class="msg"><strong>Want to see this content?</strong>
    <p>This page contains content provided by Riddle. We ask for your permission before anything is loaded.</p>
    <button id="ok">Accept and continue</button>
  </div>
</div>
<script>
document.getElementById('ok').addEventListener('click', () => {
  document.getElementById('embed').innerHTML = `<h2>Enter the competition</h2><form id="f">
    <label>Full name <input name="name" required></label><label>Email <input type="email" name="email" required></label>
    <button type="submit">Submit</button></form>`;
  document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); document.getElementById('embed').innerHTML = '<p>Thank you for entering. Good luck!</p>'; });
});
</script>
</body></html>
