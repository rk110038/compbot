<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Win a voucher</title></head>
<body>
<h1>WIN A £250 Voucher</h1>
<h2>Enter Competition</h2>
<!-- SheerLuxe: a hidden Cloudflare Turnstile holds the button ("Solving captcha...") and never lets it go. -->
<form id="f">
  <label>First name * <input name="fn" required></label>
  <label>Email address * <input type="email" name="email" required></label>
  <label><input type="checkbox" name="tc" required> By ticking this box I agree to the Terms & Conditions</label>
  <div class="captcha captcha-type-challenge--turnstile" style="width:0;height:0;overflow:hidden"></div>
  <button type="submit" disabled>Solving captcha...</button>
</form>
</body></html>
