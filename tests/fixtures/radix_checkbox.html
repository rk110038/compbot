<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Win a TaylorMade apparel bundle</title>
<style>button[role=checkbox] { width: 20px; height: 20px; border: 1px solid #333; background: #fff; vertical-align: middle; }
  button[role=checkbox][aria-checked=true] { background: #090; } .err { color: red; }</style></head>
<body>
<!-- Radix tick boxes (TaylorMade's form): the <button role="checkbox"> holds the state, and the hidden input after it
     only carries the value to the form. compbot ticked the hidden input, the button stayed unticked, and the form
     said "This field is required". -->
<h1>Win a TaylorMade apparel bundle</h1>
<form id="f" novalidate>
  <label for="fn">First name</label><input id="fn" name="first_name">
  <label for="em">Email</label><input id="em" name="email" type="email">
  <div class="fb-CheckboxBlock-module__singleRoot">
    <button type="button" role="checkbox" aria-checked="false" data-state="unchecked" value="false" id="terms_and_conditions"></button>
    <input aria-hidden="true" tabindex="-1" type="checkbox" value="false" name="terms_and_conditions" style="position: absolute; pointer-events: none; opacity: 0; margin: 0; transform: translateX(-100%); width: 20px; height: 20px;">
    <label for="terms_and_conditions">I can confirm I am 18 years or older, and have read and agree to the prize draw Terms and Conditions.*</label>
  </div>
  <p class="err" id="msg"></p>
  <button type="submit">ENTER NOW</button>
</form>
<script>
const box = document.getElementById('terms_and_conditions'), hidden = box.nextElementSibling;
box.addEventListener('click', () => {
  const on = box.getAttribute('aria-checked') !== 'true';
  box.setAttribute('aria-checked', String(on)); box.dataset.state = on ? 'checked' : 'unchecked';
  hidden.checked = on;
});
document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  if (box.getAttribute('aria-checked') !== 'true') { document.getElementById('msg').textContent = 'This field is required'; return; }
  document.body.innerHTML = '<h2>Thank you for entering!</h2>';
});
</script>
</body></html>
