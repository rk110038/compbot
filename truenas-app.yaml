# compbot for TrueNAS SCALE 24.10+ (Electric Eel / Fangtooth / later)
# Apps -> Discover Apps -> (⋮) Custom App / "Install via YAML" -> paste this file, then edit the CHANGE_ME values.
#
# Before installing:
#   1. Create datasets, e.g. /mnt/tank/apps/compbot (owned by the "apps" user, 568:568) and
#      /mnt/tank/apps/compbot-ollama (for AI models).
#   2. The image is built by GitHub Actions on every push to main and published (public) to GHCR.
#      To update: push to main, wait for the Action to go green, then in TrueNAS stop/start the app (it re-pulls).
#      (Alternative: build on the NAS with `docker build -t compbot:latest .`, set image: compbot:latest
#       and pull_policy: never.)
services:
  compbot:
    image: ghcr.io/rk110038/compbot:latest
    pull_policy: always
    container_name: compbot
    restart: unless-stopped
    init: true                 # reaps Chromium child processes
    shm_size: "1gb"            # Chromium needs more than Docker's 64 MB default
    ports:
      - "8085:8080"            # GUI at http://<truenas-ip>:8085
    volumes:
      - /mnt/tank/apps/compbot:/data   # CHANGE_ME: your dataset path (database + screenshots live here)
    environment:
      TZ: Europe/London
      # --- GUI login (required) ---
      WEB_USER: rob
      WEB_PASSWORD: CHANGE_ME_long_random_password
      # --- Competition Gmail (IMAP to read results, SMTP to send email entries) ---
      # Needs 2-Step Verification on the Google account, then create an App Password.
      GMAIL_ADDRESS: CHANGE_ME@gmail.com
      GMAIL_APP_PASSWORD: "xxxx xxxx xxxx xxxx"
      IMAP_FOLDERS: "INBOX,[Gmail]/Spam"
      # --- Where to tell you about possible wins (optional) ---
      NOTIFY_EMAIL: ""                 # e.g. your main personal address
      NTFY_URL: ""                     # e.g. https://ntfy.sh/your-secret-topic (push to your phone)
      # --- Schedules (cron, in TZ above) ---
      DISCOVER_CRON: "0 7 * * *"
      ENTER_CRON: "30 7 * * *"
      INBOX_CRON: "0 8,20 * * *"
      MAINTENANCE_CRON: "0 3 * * *"
      # --- AI helper: the bundled Ollama service below. Choose/download the model in compbot's Settings page. ---
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - ollama
    deploy:
      resources:
        limits:
          memory: 2g

  ollama:
    # compbot's Ollama image = official Ollama + NVIDIA Vulkan support (older GTX cards on TrueNAS's 550 driver).
    # AMD (ROCm) cards: use ollama/ollama:rocm instead.
    image: ghcr.io/rk110038/compbot:ollama-latest
    pull_policy: always                  # stop/start the app to get Ollama fixes too (new models often need them)
    container_name: compbot-ollama
    restart: unless-stopped
    volumes:
      - /mnt/tank/apps/compbot-ollama:/root/.ollama   # CHANGE_ME: dataset for downloaded models (several GB each)
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      # NVIDIA only (graphics = the driver's Vulkan library, used for GTX 9xx/10xx cards):
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
    # --- GPU: keep the block for your card, delete the others ---
    # NVIDIA (first tick Apps -> Configuration -> Settings -> "Install NVIDIA Drivers"):
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # AMD (ROCm, with image ollama/ollama:rocm):
    # devices: ["/dev/kfd", "/dev/dri"]
    # Intel Arc / other GPUs (Vulkan):
    # devices: ["/dev/dri"]
